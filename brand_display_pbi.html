<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Performance Display</title>

<!-- MSAL -->
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── LOGIN SCREEN ── */
  #loginScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 24px;
  }
  #loginScreen h1 { font-size: 2rem; opacity: 0.9; }
  #loginScreen p  { opacity: 0.5; font-size: 1rem; }
  #loginBtn {
    background: #0078d4;
    color: #fff;
    border: none;
    padding: 14px 36px;
    font-size: 1.1rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #loginBtn:hover { background: #106ebe; }
  #loginStatus { opacity: 0.5; font-size: 0.9rem; }

  /* ── MAIN DISPLAY ── */
  #mainDisplay { display: none; flex-direction: column; height: 100vh; }

  /* Header bar */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 32px;
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .header-title { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.08em; opacity: 0.7; }
  .header-right { display: flex; align-items: center; gap: 20px; }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
  }
  .header-time { font-size: 0.85rem; opacity: 0.5; }
  #logoutBtn {
    background: transparent;
    color: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  #logoutBtn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

  /* Slide container */
  .slides-container { flex: 1; position: relative; overflow: hidden; }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 32px 48px;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .slide.active { opacity: 1; pointer-events: auto; }

  /* Brand name + page label */
  .slide-brand {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 8px;
  }
  .brand-name {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-shadow: 0 0 40px currentColor;
  }
  .page-label {
    font-size: 1rem;
    font-weight: 500;
    opacity: 0.55;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* Period label */
  .period-label {
    font-size: 0.85rem;
    opacity: 0.4;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  /* KPI cards row */
  .kpi-row {
    display: flex;
    gap: 24px;
    flex: 1;
    align-items: stretch;
  }

  .kpi-card {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 36px 40px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: currentColor;
    opacity: 0.6;
  }

  .kpi-label {
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.5;
  }
  .kpi-value {
    font-size: clamp(2.8rem, 5vw, 5rem);
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
    margin: 20px 0;
  }
  .kpi-sub {
    font-size: 0.85rem;
    opacity: 0.4;
  }

  /* Achievement % card — special */
  .kpi-card.achievement .kpi-value {
    font-size: clamp(3.5rem, 7vw, 7rem);
  }
  .achievement-bar-bg {
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 16px;
  }
  .achievement-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
  }

  /* Loading / error state inside card */
  .kpi-loading {
    font-size: 1.1rem;
    opacity: 0.4;
    animation: blink 1.4s infinite;
  }
  @keyframes blink { 0%,100%{opacity:0.4} 50%{opacity:0.9} }
  .kpi-error { font-size: 0.9rem; color: #f87171; opacity: 0.8; }

  /* Progress dots */
  .progress-bar {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 14px;
    flex-shrink: 0;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: background 0.3s, transform 0.3s;
    cursor: pointer;
  }
  .dot.active { background: #fff; transform: scale(1.4); }

  /* Timer bar */
  .timer-bar {
    height: 2px;
    background: rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .timer-fill {
    height: 100%;
    background: rgba(255,255,255,0.3);
    width: 0%;
    transition: none;
  }
  .timer-fill.running {
    transition: width linear;
  }

  /* Grid mode */
  #gridBtn {
    background: transparent;
    color: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  #gridBtn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

  #gridView {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
    gap: 16px;
    flex-wrap: wrap;
    align-content: flex-start;
  }
  #gridView.visible { display: flex; }
  #gridView.visible ~ .slides-container { display: none; }
  #gridView.visible ~ .progress-bar { display: none; }
  #gridView.visible ~ .timer-bar { display: none; }

  .grid-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 20px 24px;
    width: calc(33.33% - 12px);
    min-width: 240px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .grid-card:hover { background: rgba(255,255,255,0.09); }
  .grid-brand { font-size: 1rem; font-weight: 700; margin-bottom: 2px; }
  .grid-page  { font-size: 0.75rem; opacity: 0.45; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .grid-nums  { display: flex; gap: 16px; }
  .grid-num span { display: block; font-size: 0.7rem; opacity: 0.4; text-transform: uppercase; letter-spacing: 0.05em; }
  .grid-num strong { font-size: 1.2rem; font-weight: 800; }

  /* Refresh indicator */
  #refreshing {
    position: fixed; bottom: 24px; right: 24px;
    background: rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.6);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.8rem;
    display: none;
  }
</style>
</head>

══════════════════════════════════════════════ */

  { brand:'Colgate', page:'School Sampling',       datasetId:'8fea41d7-081f-4874-a944-160f42c85b6c', measureTarget:'School Sampling TGT',    measureAchieved:'Kids Sampled' },
  { brand:'Colgate', page:'Event Sampling',         datasetId:'8fea41d7-081f-4874-a944-160f42c85b6c', measureTarget:'Event Sampling TGT',     measureAchieved:'Pax Sampled' },
  { brand:'Colgate', page:'Running Activities',     datasetId:'8fea41d7-081f-4874-a944-160f42c85b6c', measureTarget:'Activities TGT',         measureAchieved:'Activities Achieved' },
  { brand:'Colgate', page:'Retail Topping',         datasetId:'8fea41d7-081f-4874-a944-160f42c85b6c', measureTarget:'Retail Topping TGT',     measureAchieved:'Retail Topping Achieved' },
  { brand:'Colgate', page:'Town Storming',          datasetId:'8fea41d7-081f-4874-a944-160f42c85b6c', measureTarget:'Town Storming TGT',      measureAchieved:'Town Storming Achieved' },

  { brand:'Kelloggs', page:'School Sampling',       datasetId:'4c56dfa6-987f-44c5-9cfb-f41020ffbd0e', measureTarget:'School Sampling TGT',  measureAchieved:'Kids Sampled' },
  { brand:'Kelloggs', page:'Event Sampling',         datasetId:'4c56dfa6-987f-44c5-9cfb-f41020ffbd0e', measureTarget:'Event Sampling TGT',   measureAchieved:'Pax Sampled' },
  { brand:'Kelloggs', page:'Running Activities',     datasetId:'4c56dfa6-987f-44c5-9cfb-f41020ffbd0e', measureTarget:'Activities TGT',       measureAchieved:'Activities Achieved' },
  { brand:'Kelloggs', page:'Retail Topping',         datasetId:'4c56dfa6-987f-44c5-9cfb-f41020ffbd0e', measureTarget:'Retail Topping TGT',   measureAchieved:'Retail Topping Achieved' },

  // ── MUNCH IT ─────────────────────────────────────────────────────
  { brand:'Munch It', page:'School Sampling',       datasetId:'88ac43de-aa2e-4868-9089-a529605c2042', measureTarget:'School Sampling TGT',   measureAchieved:'Kids Sampled' },
  { brand:'Munch It', page:'Event Sampling',         datasetId:'88ac43de-aa2e-4868-9089-a529605c2042', measureTarget:'Event Sampling TGT',    measureAchieved:'Pax Sampled' },
  { brand:'Munch It', page:'Running Activities',     datasetId:'88ac43de-aa2e-4868-9089-a529605c2042', measureTarget:'Activities TGT',        measureAchieved:'Activities Achieved' },
  { brand:'Munch It', page:'Retail Topping',         datasetId:'88ac43de-aa2e-4868-9089-a529605c2042', measureTarget:'Retail Topping TGT',    measureAchieved:'Retail Topping Achieved' },

  // ── POWER OIL ────────────────────────────────────────────────────
  { brand:'Power Oil', page:'School Sampling',       datasetId:'af3d73f9-cd97-47bf-80c7-2abbf5bc19c7', measureTarget:'School Sampling TGT', measureAchieved:'Kids Sampled' },
  { brand:'Power Oil', page:'Event Sampling',         datasetId:'af3d73f9-cd97-47bf-80c7-2abbf5bc19c7', measureTarget:'Event Sampling TGT',  measureAchieved:'Pax Sampled' },
  { brand:'Power Oil', page:'Running Activities',     datasetId:'af3d73f9-cd97-47bf-80c7-2abbf5bc19c7', measureTarget:'Activities TGT',      measureAchieved:'Activities Achieved' },
  { brand:'Power Oil', page:'Retail Topping',         datasetId:'af3d73f9-cd97-47bf-80c7-2abbf5bc19c7', measureTarget:'Retail Topping TGT',  measureAchieved:'Retail Topping Achieved' },
  { brand:'Power Oil', page:'Town Storming',          datasetId:'af3d73f9-cd97-47bf-80c7-2abbf5bc19c7', measureTarget:'Town Storming TGT',   measureAchieved:'Town Storming Achieved' },
];

/* ══════════════════════════════════════════════
   MSAL SETUP
══════════════════════════════════════════════ */
const msalConfig = {
  auth: {
    clientId:   CONFIG.clientId,
    authority:  `https://login.microsoftonline.com/${CONFIG.tenantId}`,
    redirectUri: 'https://kingsley3630-cloud.github.io/brand-display/brand_display_pbi.html',
    navigateToLoginRequestUrl: false,
  },
  cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: true }
};
const msalInstance = new msal.PublicClientApplication(msalConfig);
const PBI_SCOPE    = ['https://analysis.windows.net/powerbi/api/Dataset.Read.All'];

let accessToken = null;
let dataCache   = {};   // { slideIndex: { target, achieved, ts } }

/* ══════════════════════════════════════════════
   AUTH
══════════════════════════════════════════════ */
async function initAuth() {
  try {
    const response = await msalInstance.handleRedirectPromise();
    if (response) {
      msalInstance.setActiveAccount(response.account);
    }
  } catch (e) {
    console.warn('handleRedirectPromise error:', e);
  }

  const account = msalInstance.getActiveAccount()
               || msalInstance.getAllAccounts()[0];

  if (account) {
    msalInstance.setActiveAccount(account);
    await acquireToken();
    showMainDisplay();
  } else {
    showLoginScreen();
  }
}

async function acquireToken() {
  try {
    const res = await msalInstance.acquireTokenSilent({ scopes: PBI_SCOPE });
    accessToken = res.accessToken;
  } catch (e) {
    // Silent failed — go interactive
    try {
      const res = await msalInstance.acquireTokenPopup({ scopes: PBI_SCOPE });
      accessToken = res.accessToken;
    } catch (e2) {
      console.error('Token acquisition failed:', e2);
    }
  }
}

function showLoginScreen() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('mainDisplay').style.display = 'none';
}

function showMainDisplay() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainDisplay').style.display = 'flex';
  buildSlides();
  buildGrid();
  buildDots();
  startClock();
  loadAllData();
  startSlideshow();
  scheduleDataRefresh();
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  document.getElementById('loginStatus').textContent = 'Redirecting to Microsoft…';
  try {
    await msalInstance.loginRedirect({ scopes: PBI_SCOPE, prompt: 'select_account' });
  } catch (e) {
    if (e.errorCode === 'interaction_in_progress') return;
    document.getElementById('loginStatus').textContent = 'Login error: ' + e.message;
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  msalInstance.logoutRedirect();
});

/* ══════════════════════════════════════════════
   POWER BI REST API — fetch a single measure
══════════════════════════════════════════════ */
async function fetchMeasure(datasetId, measureName) {
  if (!accessToken) await acquireToken();
  const url = `https://api.powerbi.com/v1.0/myorg/groups/${CONFIG.workspaceId}/datasets/${datasetId}/executeQueries`;
  const dax  = `EVALUATE ROW("val", [${measureName}])`;
  const body = { queries: [{ query: dax }], serializerSettings: { includeNulls: true } };

  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${accessToken}`,
      'Content-Type':  'application/json',
    },
    body: JSON.stringify(body),
  });

  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`HTTP ${res.status}: ${txt}`);
  }
  const json = await res.json();
  const rows = json?.results?.[0]?.tables?.[0]?.rows;
  if (!rows || rows.length === 0) return null;
  // The column is "[val]" in DAX result
  const val = rows[0]['[val]'];
  return val;
}

async function fetchSlideData(idx) {
  const s = SLIDES[idx];
  // Skip placeholder dataset IDs
  if (s.datasetId.startsWith('PUT_')) return null;

  try {
    const [target, achieved] = await Promise.all([
      fetchMeasure(s.datasetId, s.measureTarget),
      fetchMeasure(s.datasetId, s.measureAchieved),
    ]);
    return { target, achieved, ts: Date.now() };
  } catch (e) {
    console.error(`fetchSlideData[${idx}] error:`, e);
    return { error: e.message };
  }
}

async function loadAllData() {
  document.getElementById('refreshing').style.display = 'block';
  // Load in batches of 3 to avoid rate limits
  for (let i = 0; i < SLIDES.length; i += 3) {
    const batch = SLIDES.slice(i, i+3).map((_, j) => fetchSlideData(i+j));
    const results = await Promise.allSettled(batch);
    results.forEach((r, j) => {
      const idx = i + j;
      dataCache[idx] = r.status === 'fulfilled' ? r.value : { error: r.reason?.message };
      updateSlideKPIs(idx);
    });
  }
  document.getElementById('refreshing').style.display = 'none';
}

function scheduleDataRefresh() {
  setInterval(async () => {
    await acquireToken(); // refresh token silently if needed
    await loadAllData();
  }, CONFIG.refreshInterval * 1000);
}

/* ══════════════════════════════════════════════
   BUILD UI
══════════════════════════════════════════════ */
function fmt(n) {
  if (n == null) return '—';
  if (typeof n !== 'number') return String(n);
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1_000)     return (n / 1_000).toFixed(0) + 'K';
  return n.toLocaleString();
}

function buildSlides() {
  const container = document.getElementById('slidesContainer');
  container.innerHTML = '';
  SLIDES.forEach((s, idx) => {
    const color = CONFIG.brandColors[s.brand] || '#888';
    const slide = document.createElement('div');
    slide.className = 'slide' + (idx === 0 ? ' active' : '');
    slide.id = `slide-${idx}`;
    slide.style.color = color;
    slide.innerHTML = `
      <div class="slide-brand">
        <span class="brand-name">${s.brand}</span>
        <span class="page-label">${s.page}</span>
      </div>
      <div class="period-label" id="period-${idx}">Loading…</div>
      <div class="kpi-row">
        <div class="kpi-card" style="color:${color}">
          <div class="kpi-label">Target</div>
          <div class="kpi-value kpi-loading" id="tgt-${idx}">…</div>
          <div class="kpi-sub">${s.measureTarget}</div>
        </div>
        <div class="kpi-card" style="color:${color}">
          <div class="kpi-label">Achieved</div>
          <div class="kpi-value kpi-loading" id="ach-${idx}">…</div>
          <div class="kpi-sub">${s.measureAchieved}</div>
        </div>
        <div class="kpi-card achievement" style="color:${color}">
          <div class="kpi-label">Achievement</div>
          <div class="kpi-value kpi-loading" id="pct-${idx}">…</div>
          <div class="kpi-sub">vs Target</div>
          <div class="achievement-bar-bg">
            <div class="achievement-bar-fill" id="bar-${idx}" style="background:${color};width:0%"></div>
          </div>
        </div>
      </div>
    `;
    container.appendChild(slide);
  });
}

function updateSlideKPIs(idx) {
  const data  = dataCache[idx];
  const tgtEl = document.getElementById(`tgt-${idx}`);
  const achEl = document.getElementById(`ach-${idx}`);
  const pctEl = document.getElementById(`pct-${idx}`);
  const barEl = document.getElementById(`bar-${idx}`);
  const perEl = document.getElementById(`period-${idx}`);
  if (!tgtEl) return;

  // Update period label
  if (perEl) {
    const now = new Date();
    perEl.textContent = `As of ${now.toLocaleDateString('en-NG', { day:'numeric', month:'short', year:'numeric' })}`;
  }

  if (!data) {
    // Still loading
    tgtEl.className = 'kpi-value kpi-loading'; tgtEl.textContent = '…';
    achEl.className = 'kpi-value kpi-loading'; achEl.textContent = '…';
    pctEl.className = 'kpi-value kpi-loading'; pctEl.textContent = '…';
    return;
  }

  if (data.error) {
    tgtEl.className = 'kpi-value kpi-error'; tgtEl.textContent = 'Error';
    achEl.className = 'kpi-value kpi-error'; achEl.textContent = data.error.slice(0,40);
    pctEl.className = 'kpi-value kpi-error'; pctEl.textContent = '—';
    return;
  }

  if (data === null) {
    // Placeholder dataset — show demo values
    tgtEl.className = 'kpi-value'; tgtEl.textContent = '—';
    achEl.className = 'kpi-value'; achEl.textContent = '—';
    pctEl.className = 'kpi-value'; pctEl.textContent = '—';
    if (perEl) perEl.textContent = 'Dataset ID not configured';
    return;
  }

  const target   = data.target;
  const achieved = data.achieved;
  const pct      = (target && achieved) ? ((achieved / target) * 100) : null;

  tgtEl.className = 'kpi-value'; tgtEl.textContent = fmt(target);
  achEl.className = 'kpi-value'; achEl.textContent = fmt(achieved);
  pctEl.className = 'kpi-value';
  pctEl.textContent = pct != null ? Math.round(pct) + '%' : '—';

  if (barEl && pct != null) {
    barEl.style.width = Math.min(pct, 100) + '%';
  }

  // Also update grid card
  updateGridCard(idx, target, achieved, pct);
}

function buildGrid() {
  const grid = document.getElementById('gridView');
  grid.innerHTML = '';
  SLIDES.forEach((s, idx) => {
    const color = CONFIG.brandColors[s.brand] || '#888';
    const card  = document.createElement('div');
    card.className = 'grid-card';
    card.id = `gcrd-${idx}`;
    card.style.borderTopColor = color;
    card.style.borderTopWidth = '3px';
    card.innerHTML = `
      <div class="grid-brand" style="color:${color}">${s.brand}</div>
      <div class="grid-page">${s.page}</div>
      <div class="grid-nums">
        <div class="grid-num"><span>Target</span><strong id="gtgt-${idx}">…</strong></div>
        <div class="grid-num"><span>Achieved</span><strong id="gach-${idx}">…</strong></div>
        <div class="grid-num"><span>%</span><strong id="gpct-${idx}">…</strong></div>
      </div>
    `;
    card.addEventListener('click', () => {
      goToSlide(idx);
      toggleGrid(false);
    });
    grid.appendChild(card);
  });
}

function updateGridCard(idx, target, achieved, pct) {
  const gtgt = document.getElementById(`gtgt-${idx}`);
  const gach = document.getElementById(`gach-${idx}`);
  const gpct = document.getElementById(`gpct-${idx}`);
  if (gtgt) gtgt.textContent = fmt(target);
  if (gach) gach.textContent = fmt(achieved);
  if (gpct) gpct.textContent = pct != null ? Math.round(pct) + '%' : '—';
}

function buildDots() {
  const bar = document.getElementById('progressBar');
  bar.innerHTML = '';
  SLIDES.forEach((_, idx) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (idx === 0 ? ' active' : '');
    dot.addEventListener('click', () => { goToSlide(idx); resetTimer(); });
    bar.appendChild(dot);
  });
}

/* ══════════════════════════════════════════════
   SLIDESHOW
══════════════════════════════════════════════ */
let currentSlide = 0;
let slideTimer   = null;
let timerStart   = null;
let timerDur     = CONFIG.slideDuration * 1000;
let gridVisible  = false;

function goToSlide(idx) {
  document.getElementById(`slide-${currentSlide}`)?.classList.remove('active');
  document.querySelectorAll('.dot')[currentSlide]?.classList.remove('active');
  currentSlide = ((idx % SLIDES.length) + SLIDES.length) % SLIDES.length;
  document.getElementById(`slide-${currentSlide}`)?.classList.add('active');
  document.querySelectorAll('.dot')[currentSlide]?.classList.add('active');
}

function resetTimer() {
  clearTimeout(slideTimer);
  const fill = document.getElementById('timerFill');
  fill.style.transition = 'none';
  fill.style.width = '0%';
  timerStart = Date.now();
  setTimeout(() => {
    fill.classList.add('running');
    fill.style.transition = `width ${timerDur}ms linear`;
    fill.style.width = '100%';
  }, 50);
  slideTimer = setTimeout(nextSlide, timerDur);
}

function nextSlide() {
  goToSlide(currentSlide + 1);
  resetTimer();
}

function startSlideshow() {
  resetTimer();
}

function toggleGrid(show) {
  gridVisible = show !== undefined ? show : !gridVisible;
  const grid  = document.getElementById('gridView');
  const sc    = document.getElementById('slidesContainer');
  const pb    = document.getElementById('progressBar');
  const tb    = document.querySelector('.timer-bar');
  document.getElementById('gridBtn').textContent = gridVisible ? '◧ Slide' : '⊞ Grid';
  if (gridVisible) {
    grid.classList.add('visible');
    sc.style.display = 'none';
    pb.style.display = 'none';
    tb.style.display = 'none';
    clearTimeout(slideTimer);
  } else {
    grid.classList.remove('visible');
    sc.style.display = '';
    pb.style.display = '';
    tb.style.display = '';
    resetTimer();
  }
}

document.getElementById('gridBtn').addEventListener('click', () => toggleGrid());

/* ══════════════════════════════════════════════
   CLOCK
══════════════════════════════════════════════ */
function startClock() {
  function tick() {
    const now = new Date();
    document.getElementById('clockEl').textContent =
      now.toLocaleTimeString('en-NG', { hour:'2-digit', minute:'2-digit' });
  }
  tick();
  setInterval(tick, 10000);
}

/* ══════════════════════════════════════════════
   KEYBOARD
══════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { goToSlide(currentSlide+1); resetTimer(); }
  if (e.key === 'ArrowLeft')                   { goToSlide(currentSlide-1); resetTimer(); }
  if (e.key === 'g' || e.key === 'G')          { toggleGrid(); }
});

/* ══════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════ */
initAuth();
</script>
</body>
